# Set the HTTP port for the Quarkus application to 8080
quarkus.http.port=8080

# REST Client Configuration
quarkus.rest-client.follow-redirects=true

# We are doing this so that we can run the jar file directly using `jbang org.mcp-server:kruize-mcp-server:1.0-SNAPSHOT:runner`
quarkus.package.jar.type=uber-jar

# Enable logging to a file
quarkus.log.level=INFO
org.mcp_server.KruizeApiClient/mp-rest/url=${KRUIZE_URL:http://localhost:8080}

# Increase blocked thread check interval to reduce false positives
# This gives more time for DNS resolution and network operations
quarkus.vertx.max-event-loop-execute-time=10s

# Configure REST client timeouts to prevent hanging
quarkus.rest-client.connect-timeout=5000
quarkus.rest-client.read-timeout=30000

# Use worker thread pool for blocking operations
quarkus.vertx.prefer-native-transport=false
