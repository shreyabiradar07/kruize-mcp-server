# HTTP Server Configuration
quarkus.http.port=8080

# Package as uber-jar for easy deployment with JBang
quarkus.package.jar.type=uber-jar

# REST Client Configuration - Kruize API
quarkus.rest-client.follow-redirects=true
quarkus.rest-client."org.mcp_server.KruizeApiClient".url=${KRUIZE_URL:http://localhost:8080}
quarkus.rest-client."org.mcp_server.KruizeApiClient".connect-timeout=10000
quarkus.rest-client."org.mcp_server.KruizeApiClient".read-timeout=120000

# MCP SSE Streaming Configuration
# Prevents SSE stream disconnections during tool execution
quarkus.http.idle-timeout=30M
quarkus.http.limits.max-body-size=10M
quarkus.http.limits.max-chunk-size=8192

# MCP SSE Keepalive - Send ping every 15s to keep connection alive through proxies/NAT
quarkus.mcp.server.auto-ping-interval=15s

# Logging
quarkus.log.category."io.quarkiverse.mcp".level=INFO

